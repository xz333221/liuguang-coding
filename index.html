    <script>
      // 首屏前定主题,避免深色页面闪白。默认深色(品牌基调),用户手动切过后按用户的选择来。
      ;(function () {
        try {
          var saved = localStorage.getItem('lg-theme')
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
